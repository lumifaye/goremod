name: Xbox 360 game cross-build
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['WiiU/**', 'fork/**', 'xbox360-port/**', '.github/workflows/xbox360-game.yml']
permissions:
  contents: read
concurrency:
  group: xbox360-game-${{ github.ref }}
  cancel-in-progress: false
jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      XSDK_REF: 9e6de98f6b5d737bce0fecd2864edae94bdd2637
      XSDK_ROOT: ${{ github.workspace }}/.ci/xsdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xenosworks/xsdk
          ref: ${{ env.XSDK_REF }}
          path: .ci/xsdk
          persist-credentials: false
      - name: Exercise Xbox font raster and busy-buffer recovery
        run: |
          cc -std=gnu17 -O2 -DTARGET_XBOX360 -I"$XSDK_ROOT/include" -ffunction-sections -fdata-sections xbox360-port/tests/font_raster_test.c -Wl,--gc-sections -lm -o "$RUNNER_TEMP/font-test"
          "$RUNNER_TEMP/font-test"
          bash xbox360-port/tests/run_window_test.sh
      - name: Install host prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bison flex texinfo gawk libisl-dev libmpc-dev libmpfr-dev libgmp-dev libaudiofile-dev libpng-dev libzstd-dev zlib1g-dev ninja-build
          echo "$HOME/xsdk-gcc/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: tools
        with:
          path: ~/xsdk-gcc
          key: xsdk-ubuntu24-v1-${{ env.XSDK_REF }}
      - name: Build patched PowerPC C and C++ toolchain
        if: steps.tools.outputs.cache-hit != 'true'
        run: JOBS=3 bash xbox360-port/build-toolchain-ci.sh
      - uses: actions/cache/save@v4
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          path: ~/xsdk-gcc
          key: xsdk-ubuntu24-v1-${{ env.XSDK_REF }}
      - name: Enable VdSwap fallback for emulated displays
        run: git -C "$XSDK_ROOT" apply "$GITHUB_WORKSPACE/xbox360-port/xsdk-vdswap.patch"
      - name: Compile Fast3D vertex and pixel programs with the pinned host Xenos compiler
        run: |
          make -C "$XSDK_ROOT" -j3 WARNINGS= build/host/libxsc.so
          cc -std=gnu17 -O2 -I"$XSDK_ROOT/include" xbox360-port/tests/gpu_combiner_test.c -L"$XSDK_ROOT/build/host" -Wl,-rpath,"$XSDK_ROOT/build/host" -lxsc -lm -o "$RUNNER_TEMP/combiner-test"
          "$RUNNER_TEMP/combiner-test"
      - name: Build xSDK title runtime
        run: make -C "$XSDK_ROOT" -j3 build/libxsdk.a
      - uses: actions/checkout@v4
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: .ci/zlib
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 5d249570393f7a37e037abf22cd6012a4cc56a71
          path: .ci/sdl2
          persist-credentials: false
      - name: Cross-compile target dependencies
        shell: bash
        run: |
          xbox360-port/build-deps.sh .ci/sdl2 .ci/zlib "$RUNNER_TEMP/deps-build" "$RUNNER_TEMP/ports" 2>&1 | tee "$RUNNER_TEMP/deps.log"
      - name: Embed Realism64 and build game title
        shell: bash
        run: |
          python3 fork/apply.py pc WiiU
          ports="$RUNNER_TEMP/ports"
          make -C WiiU -j3 -k TARGET_XBOX360=1 EXTRA_INCLUDES="$ports/include" \
            XBOX_PORT_LIBS="-L$ports/lib -lSDL2" all 2>&1 | tee "$RUNNER_TEMP/game.log"
          test "$(head -c4 WiiU/build/us_xbox360/default.xex)" = XEX2
      - name: Surface compiler errors in the check annotations
        if: failure()
        shell: python
        run: |
          import os, pathlib, re
          for name in ('deps.log', 'game.log'):
              path = pathlib.Path(os.environ['RUNNER_TEMP'], name)
              if not path.is_file(): continue
              with path.open(errors='replace') as log:
                  count = 0
                  for line in log:
                      line = re.sub(r'\x1b\[[0-9;]*m', '', line).strip()
                      if not re.search(r'error:|CMake Error|undefined reference|No rule to make', line, re.I): continue
                      print('::error title=' + name + '::' + line[:1200].replace('%', '%25'))
                      count += 1
                      if count == 12: break
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compiler-logs
          path: |
            ~/xsdk-gcc-work/logs/
            ${{ runner.temp }}/game.log
            ${{ runner.temp }}/deps.log
      - uses: actions/upload-artifact@v4
        with:
          name: Realism64-Xbox360
          path: |
            WiiU/build/us_xbox360/default.xex
            WiiU/build/us_xbox360/lang/
            WiiU/build/us_xbox360/mods/
            WiiU/build/us_xbox360/palettes/
          if-no-files-found: error
