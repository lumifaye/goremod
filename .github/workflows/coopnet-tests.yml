name: CoopNet integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  networking:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch the transport used by Wii U release staging
        run: git fetch --no-tags --depth=1 origin fdfff4b17e812e6caa2724ce82bbcb4b796452c5
      - name: Exercise coordinator, ICE and UDP in both hosting directions
        run: python3 fork/tests/coopnet_integration_test.py
      - name: Exercise game retry, acknowledgement and shutdown cleanup
        run: |
          python3 fork/tests/coopnet_reliable_retry_test.py
          python3 fork/tests/coopnet_reliable_cleanup_test.py
          python3 fork/tests/coopnet_handshake_test.py
          bash fork/tests/coopnet_receive_test.sh
