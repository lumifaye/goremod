
name: Build Realism64

on:
  workflow_dispatch:
    inputs:
      builds:
        description: Which builds
        type: choice
        default: all
        options: [all, pc, linux, macos, pcvr, android, quest, wiiu]
  push:

permissions:
  contents: read

jobs:
  pc:
    name: PC (Windows)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.builds == 'all' || inputs.builds == 'pc')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build pc]')))
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line ends as they are
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/VR/
            !/Android/
            !/WiiU/

      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            make
            git
            zip
            unzip
            python3
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2

      - name: Get the game and change it
        run: python3 fork/apply.py pc game

      - name: Build
        run: bash fork/ci.sh "Build" make -C game -j$(nproc)

      - name: Pack
        run: |
          bash fork/ci.sh "Pack" bash -e -x <<'STEP'
          mkdir -p out/Realism64
          cd game/build/us_pc
          cp -r dynos lang mods palettes discord_game_sdk.dll sm64coopdx.exe ../../../out/Realism64/
          cd ../../../out
          bash ../fork/ci-dlls.sh Realism64/sm64coopdx.exe Realism64
          while IFS= read -r mod; do test -f "Realism64/mods/$mod/built-in.txt"; done < ../game/fork-built-in-mods.txt
          test ! -e Realism64/mods/Gore-Hardmode
          mkdir -p starttest
          (timeout 120 Realism64/sm64coopdx.exe --headless --hide-loading-screen --savepath "$(cygpath -w "$PWD/starttest")" || true) > starttest.txt 2>&1
          tail -n 20 starttest.txt
          grep -q "could not find valid vanilla us sm64 rom" starttest.txt
          bash ../fork/ci-embedded.sh starttest ../game ..
          rm -rf starttest starttest.txt || true
          zip -q -r Realism64-Windows.zip Realism64
          STEP

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: realism64-pc-windows
          path: out/Realism64-Windows.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: PC (Linux)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.builds == 'all' || inputs.builds == 'linux')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build linux]')))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/VR/
            !/Android/
            !/WiiU/

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev zip unzip patchelf

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu22-linux-v1-${{ github.sha }}
          restore-keys: ccache-ubuntu22-linux-v1-

      - name: Enable compiler cache for host builds
        run: |
          ccache --set-config=max_size=300M
          echo /usr/lib/ccache >> "$GITHUB_PATH"

      - name: Get the game and change it
        run: python3 fork/apply.py pc game

      - name: Build
        run: bash fork/ci.sh "Build" make -C game -j$(nproc)

      - name: Pack
        run: |
          bash fork/ci.sh "Pack" bash -e -x <<'STEP'
          mkdir -p out/Realism64
          cd game/build/us_pc
          cp -r dynos lang mods palettes libdiscord_game_sdk.so sm64coopdx ../../../out/Realism64/
          cd ../../../out
          cp ../fork/README-linux.txt Realism64/README.txt
          cp ../fork/icon/icon.png Realism64/icon.png
          chmod +x Realism64/sm64coopdx
          patchelf --set-rpath '$ORIGIN' Realism64/sm64coopdx
          here="$PWD"
          (cd / && ldd "$here/Realism64/sm64coopdx") > "$RUNNER_TEMP/ldd.txt"
          cat "$RUNNER_TEMP/ldd.txt"
          if grep -q "not found" "$RUNNER_TEMP/ldd.txt"; then exit 1; fi
          grep -q "Realism64/libdiscord_game_sdk.so" "$RUNNER_TEMP/ldd.txt"
          while IFS= read -r mod; do test -f "Realism64/mods/$mod/built-in.txt"; done < ../game/fork-built-in-mods.txt
          mkdir -p "$RUNNER_TEMP/save"
          (cd / && timeout 120 "$here/Realism64/sm64coopdx" --headless --hide-loading-screen --savepath "$RUNNER_TEMP/save") > "$RUNNER_TEMP/start.txt" 2>&1 || true
          tail -n 20 "$RUNNER_TEMP/start.txt"
          grep -q "could not find valid vanilla us sm64 rom" "$RUNNER_TEMP/start.txt"
          test ! -e Realism64/mods/Gore-Hardmode
          bash ../fork/ci-embedded.sh "$RUNNER_TEMP/save" ../game ..
          echo "::notice title=Linux build::starts as far as asking for the ROM; from the system it needs: $(objdump -p Realism64/sm64coopdx | awk '/NEEDED/ { printf "%s ", $2 }')"
          zip -q -r Realism64-Linux.zip Realism64
          STEP

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: realism64-pc-linux
          path: out/Realism64-Linux.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: PC (macOS, ${{ matrix.name }})
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.builds == 'all' || inputs.builds == 'macos')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build macos]')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            runner: macos-26
            arch: arm64
            oldest: '11'
            prefix: /opt/homebrew
            file: Realism64-macOS-AppleSilicon.zip
            artifact: realism64-pc-macos-arm
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
            oldest: '10.15'
            prefix: /usr/local
            file: Realism64-macOS-Intel.zip
            artifact: realism64-pc-macos-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PKG_CONFIG_PATH: ${{ matrix.prefix }}/lib/pkgconfig
    steps:
      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/VR/
            !/Android/
            !/WiiU/

      - name: Install build tools
        run: |
          brew install make mingw-w64 pkg-config coreutils
          ls "$(brew --prefix)"/bin/cpp-[0-9]* > /dev/null 2>&1 || brew install gcc
          ls "$(brew --prefix)"/bin/cpp-[0-9]*

      - name: Compile GLEW
        run: |
          cd "$RUNNER_TEMP"
          export MACOSX_DEPLOYMENT_TARGET=${{ matrix.oldest }}
          curl -f -L -o glew.tar.gz https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
          tar -xzf glew.tar.gz
          cd glew-2.2.0
          make SYSTEM=darwin CC="clang -arch ${{ matrix.arch }} -mmacosx-version-min=${{ matrix.oldest }}" GLEW_PREFIX=${{ matrix.prefix }} GLEW_DEST=${{ matrix.prefix }}
          make install SYSTEM=darwin GLEW_PREFIX=${{ matrix.prefix }} GLEW_DEST=${{ matrix.prefix }}

      - name: Compile SDL2
        run: |
          cd "$RUNNER_TEMP"
          curl -f -L -o SDL2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
          tar -xzf SDL2.tar.gz
          cd SDL2-2.30.9
          ./configure --prefix=${{ matrix.prefix }} CC="clang -arch ${{ matrix.arch }} -mmacosx-version-min=${{ matrix.oldest }}"
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Get the game and change it
        run: python3 fork/apply.py pc game

      - name: Build
        run: bash fork/ci.sh "Build" gmake -C game OSX_BUILD=1 -j$(sysctl -n hw.ncpu)

      - name: Pack
        run: |
          bash fork/ci.sh "Pack" bash -e -x <<'STEP'
          mkdir -p out
          mv game/build/us_pc/sm64coopdx.app out/Realism64.app
          cd out
          app=Realism64.app
          plutil -lint $app/Contents/Info.plist
          plutil -p $app/Contents/Info.plist
          test "$(plutil -extract NSMicrophoneUsageDescription raw $app/Contents/Info.plist | wc -c)" -gt 10
          while IFS= read -r mod; do test -f "$app/Contents/Resources/mods/$mod/built-in.txt"; done < ../game/fork-built-in-mods.txt
          otool -L $app/Contents/MacOS/sm64coopdx | tee "$RUNNER_TEMP/libs.txt"
          if tail -n +2 "$RUNNER_TEMP/libs.txt" | grep -v -E '^[[:space:]]*(@executable_path|@rpath|@loader_path|/usr/lib/|/System/)'; then
            echo "the program asks for a library that is not in the app"
            exit 1
          fi
          lipo -archs $app/Contents/MacOS/sm64coopdx | grep -q -x "${{ matrix.arch }}"
          codesign --force --deep --sign - $app
          codesign --verify --deep --strict $app
          here="$PWD"
          mkdir -p "$RUNNER_TEMP/save"
          (cd / && gtimeout 120 "$here/$app/Contents/MacOS/sm64coopdx" --headless --hide-loading-screen --savepath "$RUNNER_TEMP/save") > "$RUNNER_TEMP/start.txt" 2>&1 || true
          tail -n 20 "$RUNNER_TEMP/start.txt"
          grep -q "could not find valid vanilla us sm64 rom" "$RUNNER_TEMP/start.txt"
          test ! -e "$app/Contents/Resources/mods/Gore-Hardmode"
          bash ../fork/ci-embedded.sh "$RUNNER_TEMP/save" ../game ..
          codesign --verify --deep --strict $app
          echo "::notice title=macOS build (${{ matrix.name }})::starts as far as asking for the ROM; it asks for: $(tail -n +2 "$RUNNER_TEMP/libs.txt" | awk '{ printf "%s ", $1 }')"
          ditto -c -k --keepParent $app "${{ matrix.file }}"
          STEP

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  pcvr:
    name: PC VR (Windows)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.builds == 'all' || inputs.builds == 'pcvr')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build pcvr]')))
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line ends as they are
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/PC/
            !/Android/
            !/WiiU/

      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            make
            git
            zip
            unzip
            python3
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-openxr-sdk
            mingw-w64-x86_64-SDL2

      - name: Get the game and change it
        run: python3 fork/apply.py vr game

      - name: Build
        run: bash fork/ci.sh "Build" make -C game -j$(nproc)

      - name: Pack
        run: |
          bash fork/ci.sh "Pack" bash -e -x <<'STEP'
          stage=out/Realism64-VR
          mkdir -p $stage/licenses
          cd game
          cp build/us_pc/sm64coopdx.exe ../$stage/SM64-Co-Op-DX-VR.exe
          cp build/us_pc/discord_game_sdk.dll build/us_pc/normal_maps.bin ../$stage/
          cp -r build/us_pc/dynos build/us_pc/lang build/us_pc/mods build/us_pc/palettes build/us_pc/sonic_shoes ../$stage/
          bash ../fork/ci-dlls.sh ../$stage/SM64-Co-Op-DX-VR.exe ../$stage libopenxr_loader.dll
          test -f ../$stage/libopenxr_loader.dll
          cp docs/PC-VR-PLAYER-GUIDE.txt ../$stage/README.txt
          cp release_notes.txt tools/Launch-VR-Diagnostics.cmd ../$stage/
          cp docs/VR-SPEEDRUN.txt docs/PROPELLER-MUSHROOM.txt docs/PHYSICAL-JUMPING.txt docs/PHYSICAL-SWIMMING.txt docs/POWER-UP-SPAWN-WEIGHTS.txt ../$stage/
          cd ../out
          while IFS= read -r mod; do test -f "Realism64-VR/mods/$mod/built-in.txt"; done < ../game/fork-built-in-mods.txt
          test ! -e Realism64-VR/mods/Gore-Hardmode
          mkdir -p starttest
          (timeout 120 Realism64-VR/SM64-Co-Op-DX-VR.exe --headless --hide-loading-screen --savepath "$(cygpath -w "$PWD/starttest")" || true) > starttest.txt 2>&1
          tail -n 20 starttest.txt
          grep -q "could not find valid vanilla us sm64 rom" starttest.txt
          bash ../fork/ci-embedded.sh starttest ../game ..
          rm -rf starttest starttest.txt || true
          zip -q -r Realism64-VR-Windows.zip Realism64-VR
          STEP

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: realism64-pcvr-windows
          path: out/Realism64-VR-Windows.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android:
    name: Android (APK)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.builds == 'all' || inputs.builds == 'android')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build android]')))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/PC/
            !/VR/
            !/WiiU/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle
            Android/**/gradle-wrapper.properties

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev zip unzip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          bash fork/ci.sh "Install the NDK" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu22-android-v1-${{ github.sha }}
          restore-keys: ccache-ubuntu22-android-v1-

      - name: Enable compiler cache for host builds
        run: |
          ccache --set-config=max_size=300M
          echo /usr/lib/ccache >> "$GITHUB_PATH"

      - name: Get the game and change it
        run: python3 fork/apply.py android game

      - name: Build the game for this machine
        run: bash fork/ci.sh "Build the game for this machine" make -C game -j$(nproc) TOUCH_CONTROLS=1

      - name: Build the app
        working-directory: game
        run: |
          chmod +x platform/gradlew
          # Retry only packaging failures; do not hide compilation or signing errors.
          gradle=(./platform/gradlew --no-daemon --stacktrace assembleRelease)
          log="$RUNNER_TEMP/android-assemble.log"
          if ! "${gradle[@]}" > "$log" 2>&1; then
            cat "$log"
            grep -Fq "> Task :platform:app:packageRelease FAILED" "$log" || exit 1
            echo "::warning::Android APK packaging failed; retrying once with one worker"
            bash "$GITHUB_WORKSPACE/fork/ci.sh" "Retry APK packaging" "${gradle[@]}" --max-workers=1
          else
            cat "$log"
          fi

      - name: Pack
        run: |
          bash fork/ci.sh "Pack" bash -e -x <<'STEP'
          mkdir -p out
          ls -l game/platform/app/build/outputs/apk/release/
          cp game/platform/app/build/outputs/apk/release/app-release.apk out/Realism64-Android.apk
          unzip -l out/Realism64-Android.apk > "$RUNNER_TEMP/apk.txt"
          while IFS= read -r mod; do grep -q -F "assets/mods/$mod/built-in.txt" "$RUNNER_TEMP/apk.txt"; done < game/fork-built-in-mods.txt
          if grep -q -F "assets/mods/Gore-Hardmode/" "$RUNNER_TEMP/apk.txt"; then exit 1; fi
          rm -rf "$RUNNER_TEMP/apk" && mkdir -p "$RUNNER_TEMP/apk"
          unzip -q -o out/Realism64-Android.apk 'lib/arm64-v8a/*' -d "$RUNNER_TEMP/apk"
          ls -l "$RUNNER_TEMP/apk/lib/arm64-v8a"
          grep -l -a -F "Gore-Hardmode/built-in.txt" "$RUNNER_TEMP"/apk/lib/arm64-v8a/*.so
          STEP

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: realism64-android
          path: out/Realism64-Android.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  quest:
    name: Quest (APK)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.builds == 'all' || inputs.builds == 'quest')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build quest]')))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/PC/
            !/Android/
            !/WiiU/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            VR/**/*.gradle
            VR/**/gradle-wrapper.properties

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev zip unzip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu22-quest-v1-${{ github.sha }}
          restore-keys: ccache-ubuntu22-quest-v1-

      - name: Enable compiler cache for host builds
        run: |
          ccache --set-config=max_size=300M
          echo /usr/lib/ccache >> "$GITHUB_PATH"

      - name: Get the game and change it
        run: python3 fork/apply.py vr game

      - name: Make the generated files
        run: |
          make -C game -k -j$(nproc) > "$RUNNER_TEMP/host-build.log" 2>&1 || true
          bash fork/ci.sh "Make the generated files" bash -e <<'STEP'
          cd game/build/us_pc
          for file in assets/mario_anim_data.c assets/demo_data.c include/level_headers.h sound/sound_data.ctl.inc.c sound/sound_data.tbl.inc.c sound/sequences.bin.inc.c sound/bank_sets.inc.c text/us/define_text.inc.c; do
            if [ ! -s "$file" ]; then
              echo "not made: build/us_pc/$file"
              grep -n -i -E "error|No rule|not found" "$RUNNER_TEMP/host-build.log" | head -30
              tail -n 15 "$RUNNER_TEMP/host-build.log"
              exit 1
            fi
          done
          echo "generated: $(find . -name '*.inc.c' | wc -l) .inc.c files"
          STEP

      - name: Build the app
        working-directory: game/platform/android
        run: |
          chmod +x gradlew
          bash "$GITHUB_WORKSPACE/fork/ci.sh" "Build the app" ./gradlew --no-daemon assembleDebug -Psm64Target=quest "-Psm64GeneratedRoot=$GITHUB_WORKSPACE/game/build/us_pc"

      - name: Pack
        run: |
          bash fork/ci.sh "Pack" bash -e -x <<'STEP'
          mkdir -p out
          ls -l game/platform/android/app/build/outputs/apk/debug/
          cp game/platform/android/app/build/outputs/apk/debug/app-debug.apk out/Realism64-VR-Quest.apk
          unzip -l out/Realism64-VR-Quest.apk > "$RUNNER_TEMP/apk.txt"
          while IFS= read -r mod; do grep -q -F "assets/mods/$mod/built-in.txt" "$RUNNER_TEMP/apk.txt"; done < game/fork-built-in-mods.txt
          if grep -q -F "assets/mods/Gore-Hardmode/" "$RUNNER_TEMP/apk.txt"; then exit 1; fi
          rm -rf "$RUNNER_TEMP/apk" && mkdir -p "$RUNNER_TEMP/apk"
          unzip -q -o out/Realism64-VR-Quest.apk 'lib/arm64-v8a/*' -d "$RUNNER_TEMP/apk"
          ls -l "$RUNNER_TEMP/apk/lib/arm64-v8a"
          grep -l -a -F "Gore-Hardmode/built-in.txt" "$RUNNER_TEMP"/apk/lib/arm64-v8a/*.so
          STEP

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: realism64-quest
          path: out/Realism64-VR-Quest.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  wiiu:
    name: Wii U (${{ matrix.title }})
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.builds == 'all' || inputs.builds == 'wiiu')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[build wiiu]') || contains(github.event.head_commit.message, '[wiiu]')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    container: devkitpro/devkitppc:latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: fork
            title: Realism64
            file: Realism64-WiiU
          - variant: game
            title: SM64 CoopDX
            file: SM64CoopDX-WiiU
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEBIAN_FRONTEND: noninteractive
      VARIANT: ${{ matrix.variant }}
      TITLE: ${{ matrix.title }}
      FILE: ${{ matrix.file }}
    steps:
      - name: Programs the build needs besides the compiler
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates build-essential python3 rsync bsdextrautils zlib1g-dev pkg-config zip

      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/PC/
            !/VR/
            !/Android/

      - name: What the container has
        if: matrix.variant == 'game'
        run: |
          OUT="$GITHUB_WORKSPACE/ci-out"; mkdir -p "$OUT"
          {
            echo "DEVKITPRO=$DEVKITPRO DEVKITPPC=$DEVKITPPC"
            "$DEVKITPPC/bin/powerpc-eabi-gcc" --version | head -1
            (dkp-pacman -Q 2>/dev/null || pacman -Q 2>/dev/null) | tr '\n' ' '
            echo
            echo "--- wut/lib"; ls "$DEVKITPRO/wut/lib" "$DEVKITPRO/wut/share" 2>&1 | tr '\n' ' '
            echo
            echo "--- portlibs/wiiu/lib"; ls "$DEVKITPRO/portlibs/wiiu/lib" 2>&1 | tr '\n' ' '
            echo
            echo "--- portlibs/ppc/lib"; ls "$DEVKITPRO/portlibs/ppc/lib" 2>&1 | tr '\n' ' '
            echo
            echo "--- tools"; ls "$DEVKITPRO/tools/bin" 2>&1 | tr '\n' ' '
            echo
            for p in elf2rpl wuhbtool rsync hexdump python3 gcc g++ make zip; do printf '%s: ' "$p"; command -v "$p" || echo MISSING; done
          } > "$OUT/container.txt" 2>&1
          cat "$OUT/container.txt"
          python3 fork/ci_report.py "Wii U: container" "$OUT/container.txt"

      - name: This project's changes (fork/apply.py)
        if: matrix.variant == 'fork'
        run: |
          OUT="$GITHUB_WORKSPACE/ci-out"; mkdir -p "$OUT"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set +e
          python3 fork/apply.py pc WiiU > "$OUT/apply.txt" 2>&1
          status=$?
          set -e
          tail -n 40 "$OUT/apply.txt"
          python3 fork/ci_report.py "Wii U ($TITLE): changes" "$OUT/apply.txt"
          exit "$status"

      - name: Build
        id: build
        working-directory: WiiU
        run: |
          OUT="$GITHUB_WORKSPACE/ci-out"; mkdir -p "$OUT"
          export PATH="$DEVKITPRO/tools/bin:$DEVKITPPC/bin:$PATH"
          set +e
          make -k -j"$(nproc)" TARGET_WII_U=1 > "$OUT/build.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            if [ "$VARIANT" = fork ]; then
              make TARGET_WII_U=1 wuhb WUHB_NAME="Realism64" WUHB_SHORT_NAME="Realism64" WUHB_AUTHOR="lumifaye" \
                WUHB_ICON="$GITHUB_WORKSPACE/fork/icon/icon.png" >> "$OUT/build.log" 2>&1
            else
              make TARGET_WII_U=1 wuhb >> "$OUT/build.log" 2>&1
            fi
            status=$?
          fi
          set -e
          sed -i -e 's/\x1b\[[0-9;]*[A-Za-z]//g' "$OUT/build.log"
          tail -n 60 "$OUT/build.log"
          grep -n -E '(^|[^a-z_])(fatal error|error)[: ]|undefined reference|multiple definition|cannot find|No such file|No rule to make|\*\*\*|not found|ld returned' "$OUT/build.log" \
            | grep -v -E 'Werror|Wno-error' | cut -c1-400 > "$OUT/errors.txt" || true
          grep -v '^Writing /content/' "$OUT/build.log" | tail -n 120 | cut -c1-600 > "$OUT/tail.txt"
          {
            ls -l build/us_wiiu/*.rpx build/us_wiiu/*.wuhb 2>&1
            echo "--- warnings: $(grep -c 'warning:' "$OUT/build.log")"
            echo "--- files packed into the .wuhb: $(grep -c '^Writing /content/' "$OUT/build.log")"
            echo "--- mods in the .wuhb:"; ls build/us_wiiu/wuhb_content/mods 2>&1
            echo "--- size of the program's parts"; powerpc-eabi-size build/us_wiiu/*.elf 2>&1
            echo "--- system libraries the .rpx asks the console for"
            powerpc-eabi-readelf -S --wide build/us_wiiu/*.rpx 2>&1 | grep -o 'import_[A-Za-z0-9_]*' | sort -u | tr '\n' ' '
            echo
          } > "$OUT/out.txt" 2>&1 || true
          cd ..
          python3 fork/ci_report.py "Wii U ($TITLE): errors" "$OUT/errors.txt"
          python3 fork/ci_report.py "Wii U ($TITLE): last lines" "$OUT/tail.txt"
          python3 fork/ci_report.py "Wii U ($TITLE): files" "$OUT/out.txt"
          exit "$status"

      - name: Pack for the SD card
        run: |
          OUT="$GITHUB_WORKSPACE/ci-out"
          SD="$OUT/sd"; APP="$SD/wiiu/apps/sm64coopdx"
          mkdir -p "$APP/roms" "$APP/mods" "$OUT/dist"
          cp WiiU/build/us_wiiu/sm64coopdx.us.wuhb "$APP/$FILE.wuhb"
          cp WiiU/build/us_wiiu/sm64coopdx.us.rpx "$OUT/dist/$FILE.rpx"
          cp fork/wiiu-readme.txt "$SD/README-$FILE.txt"
          (cd "$SD" && zip -q -r "$OUT/dist/$FILE.zip" .)
          ls -l "$OUT/dist"
          unzip -l "$OUT/dist/$FILE.zip" || true

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiiu-build-log-${{ matrix.variant }}
          path: ci-out/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: realism64-wiiu-${{ matrix.variant }}
          path: |
            ci-out/dist/*.zip
            ci-out/dist/*.rpx
          if-no-files-found: error
          retention-days: 14


  release:
    name: Release
    needs: [pc, linux, macos, pcvr, android, quest, wiiu]
    if: >-
      always() && !cancelled() &&
      (needs.pc.result == 'success' || needs.linux.result == 'success' || needs.macos.result != 'skipped' ||
       needs.pcvr.result == 'success' || needs.android.result == 'success' || needs.quest.result == 'success' ||
       needs.wiiu.result != 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/PC/
            !/VR/
            !/Android/
            !/WiiU/

      - name: Get what was built
        uses: actions/download-artifact@v4
        with:
          pattern: realism64-*
          path: built
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l built
          bash fork/ci.sh "Release" bash fork/ci-release.sh built
