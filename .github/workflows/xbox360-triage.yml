name: Xbox 360 compiler diagnostics
on:
  workflow_dispatch:
    inputs:
      run:
        description: Failed Xbox build run ID
        required: true
        type: string
  push:
    paths: ['.github/workflows/xbox360-triage.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Surface compiler and configure errors from the failed job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run || '44458807633' }}
        run: |
          gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/build.log"
          python3 - <<'PY'
          import pathlib, os, re
          lines = pathlib.Path(os.environ['RUNNER_TEMP'], 'build.log').read_text(errors='replace').splitlines()
          errors = sorted(set(re.sub(r'^.*?Z ', '', line.split('\t')[-1]) for line in lines if re.search(r'(?:fatal )?error:|undefined reference|No rule to make|multiple definition',line,re.I)))
          for i in range(0,len(errors),20):
              text='\n'.join(errors[i:i+20])[:6000]
              print('::notice title=Cross-compiler errors::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
